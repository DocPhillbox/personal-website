<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- In ring-space, everything below the centre line is the near side of the
         ring, so it is redrawn on top of the planet to pass in front of it. -->
    <clipPath id="ringFront">
      <rect x="0" y="32" width="64" height="32" />
    </clipPath>
  </defs>

  <g transform="rotate(-24 32 32)">
    <ellipse cx="32" cy="32" rx="27.5" ry="8.5" fill="none" stroke="#fff" stroke-width="3.2" />
  </g>

  <circle cx="32" cy="32" r="16.5" fill="#000" />

  <g transform="rotate(-24 32 32)" clip-path="url(#ringFront)">
    <ellipse cx="32" cy="32" rx="27.5" ry="8.5" fill="none" stroke="#fff" stroke-width="3.2" />
  </g>
</svg>
